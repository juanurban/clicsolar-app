name: Despliegue a Hostinger (Node.js + Frontend)

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Instalar dependencias
        run: npm ci

      - name: Preparar carpeta de despliegue
        run: |
          mkdir -p deploy_dist

          # ── Archivos del Backend (Node.js) ──
          cp server.js deploy_dist/
          cp db.js deploy_dist/
          cp package.json deploy_dist/
          cp package-lock.json deploy_dist/
          cp -r routes deploy_dist/

          # ── Archivos del Frontend ──
          cp -r templates deploy_dist/
          cp -r static deploy_dist/

          # ── Archivos de configuración ──
          cp .env.example deploy_dist/
          cp schema.sql deploy_dist/
          cp seed.sql deploy_dist/

          # ── Forzar reinicio de Node.js en Hostinger (Passenger) ──
          mkdir -p deploy_dist/tmp
          date > deploy_dist/tmp/restart.txt

          # ── Crear .htaccess para enrutamiento ──
          cat << 'EOF' > deploy_dist/.htaccess
          RewriteEngine On
          RewriteRule ^login$ login.html [L]
          RewriteCond %{REQUEST_FILENAME} -f [OR]
          RewriteCond %{REQUEST_FILENAME} -d
          RewriteRule ^ - [L]
          RewriteRule ^ index.html [L]
          EOF

      - name: Subir a Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./deploy_dist/
          server-dir: /public_html/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/.env
            **/__pycache__/**
            **/*.pyc
            **/*.db
