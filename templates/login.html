<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>SunQuote — Iniciar Sesión</title>
    <meta name="description" content="Iniciar sesión en SunQuote — Cotizador Solar FV"/>
    <link rel="icon" href="/static/img/logo.svg" type="image/svg+xml"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Montserrat:wght@100..900&display=swap" rel="stylesheet"/>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #131313;
            color: #e4e2e1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* Animated background */
        .bg-glow {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
        }
        .bg-glow::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(ellipse at 30% 20%, rgba(255, 200, 0, 0.06) 0%, transparent 50%),
                        radial-gradient(ellipse at 70% 80%, rgba(255, 200, 0, 0.04) 0%, transparent 50%);
            animation: bgRotate 30s linear infinite;
        }
        @keyframes bgRotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .login-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 440px;
            margin: 0 16px;
        }

        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        .login-header img {
            height: 48px;
            margin-bottom: 16px;
            filter: drop-shadow(0 0 20px rgba(255, 200, 0, 0.3));
        }
        .login-header h1 {
            font-family: 'Montserrat', sans-serif;
            font-size: 28px;
            font-weight: 800;
            color: #ffeabb;
            letter-spacing: -0.02em;
        }
        .login-header p {
            color: #9b9078;
            font-size: 14px;
            margin-top: 8px;
        }

        .login-form {
            background: #1f2020;
            border: 1px solid #2a2a2a;
            border-radius: 16px;
            padding: 40px 32px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4),
                        0 0 0 1px rgba(255, 200, 0, 0.05);
        }

        .input-group {
            margin-bottom: 24px;
            position: relative;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.08em;
            color: #d2c5ab;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        .input-wrapper {
            position: relative;
        }
        .input-wrapper .material-symbols-outlined {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #9b9078;
            font-size: 20px;
            pointer-events: none;
            transition: color 0.2s;
        }
        .input-wrapper input {
            width: 100%;
            background: #2a2a2a;
            border: 1px solid #4f4632;
            border-radius: 12px;
            padding: 14px 16px 14px 48px;
            color: #e4e2e1;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-wrapper input:focus {
            border-color: #ffc800;
            box-shadow: 0 0 0 3px rgba(255, 200, 0, 0.12);
        }
        .input-wrapper input:focus + .material-symbols-outlined,
        .input-wrapper input:focus ~ .material-symbols-outlined {
            color: #ffc800;
        }
        .input-wrapper input::placeholder {
            color: #6b6560;
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #9b9078;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            pointer-events: all;
        }
        .toggle-password:hover { color: #d2c5ab; }

        .btn-login {
            width: 100%;
            padding: 16px;
            background: #ffc800;
            color: #3e2e00;
            border: none;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }
        .btn-login:hover { filter: brightness(1.1); transform: translateY(-1px); }
        .btn-login:active { transform: scale(0.98) translateY(0); }
        .btn-login:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        .error-msg {
            background: rgba(147, 0, 10, 0.15);
            border: 1px solid rgba(255, 180, 171, 0.2);
            color: #ffb4ab;
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin-bottom: 20px;
            display: none;
            align-items: center;
            gap: 8px;
        }
        .error-msg.show { display: flex; }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2.5px solid rgba(62, 46, 0, 0.3);
            border-top-color: #3e2e00;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .login-footer {
            text-align: center;
            margin-top: 24px;
            color: #6b6560;
            font-size: 12px;
        }
    </style>
</head>
<body>

<div class="bg-glow"></div>

<div class="login-card">
    <div class="login-header">
        <img id="login-logo" src="/static/img/logo.svg" alt="SunQuote Logo"/>
        <h1 id="login-brand">SunQuote</h1>
        <p>Cotizador Solar Fotovoltaico</p>
    </div>

    <form class="login-form" id="login-form" onsubmit="handleLogin(event)">
        <div class="error-msg" id="error-msg">
            <span class="material-symbols-outlined" style="font-size:18px;">error</span>
            <span id="error-text">Error de autenticación</span>
        </div>

        <div class="input-group">
            <label for="username">Usuario</label>
            <div class="input-wrapper">
                <input type="text" id="username" name="username" placeholder="Ingresa tu usuario" required autocomplete="username" autofocus/>
                <span class="material-symbols-outlined">person</span>
            </div>
        </div>

        <div class="input-group">
            <label for="password">Contraseña</label>
            <div class="input-wrapper">
                <input type="password" id="password" name="password" placeholder="Ingresa tu contraseña" required autocomplete="current-password"/>
                <span class="material-symbols-outlined" style="left:16px">lock</span>
                <button type="button" class="toggle-password" onclick="togglePasswordVisibility()">
                    <span class="material-symbols-outlined" style="font-size:20px" id="eye-icon">visibility_off</span>
                </button>
            </div>
        </div>

        <button type="submit" class="btn-login" id="btn-login">
            <span class="material-symbols-outlined" style="font-size:20px">login</span>
            Iniciar Sesión
        </button>
    </form>

    <div class="login-footer">
        <span id="footer-brand">SunQuote</span> — Sistema de Cotización Solar FV
    </div>
</div>

<script>
    // Load branding
    (async () => {
        try {
            const res = await fetch('/api/configuracion');
            const data = await res.json();
            const logo = data.empresa_logo?.valor;
            const nombre = data.empresa_nombre?.valor;
            if (logo) document.getElementById('login-logo').src = logo;
            if (nombre) {
                document.getElementById('login-brand').textContent = nombre;
                document.getElementById('footer-brand').textContent = nombre;
                document.title = `${nombre} — Iniciar Sesión`;
            }
        } catch {}
    })();

    function togglePasswordVisibility() {
        const pw = document.getElementById('password');
        const icon = document.getElementById('eye-icon');
        if (pw.type === 'password') {
            pw.type = 'text';
            icon.textContent = 'visibility';
        } else {
            pw.type = 'password';
            icon.textContent = 'visibility_off';
        }
    }

    async function handleLogin(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-login');
        const errDiv = document.getElementById('error-msg');
        const errText = document.getElementById('error-text');

        btn.disabled = true;
        btn.innerHTML = '<div class="spinner"></div> Verificando...';
        errDiv.classList.remove('show');

        try {
            const res = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    username: document.getElementById('username').value.trim(),
                    password: document.getElementById('password').value,
                }),
            });
            const data = await res.json();
            if (!res.ok) throw new Error(data.detail || 'Error de autenticación');

            // Redirect to app
            window.location.href = '/';
        } catch (err) {
            errText.textContent = err.message;
            errDiv.classList.add('show');
            btn.disabled = false;
            btn.innerHTML = '<span class="material-symbols-outlined" style="font-size:20px">login</span> Iniciar Sesión';
        }
    }
</script>

</body>
</html>
