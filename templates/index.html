    </div>
    <nav id="nav-menu" class="flex-1 px-4 mt-4 flex flex-col gap-2">
        <a class="nav-link flex items-center px-4 py-3 rounded-xl transition-all font-label-bold text-label-bold" data-page="dashboard" href="#dashboard">
            <span class="material-symbols-outlined mr-4">dashboard</span>Dashboard
        </a>
        <a class="nav-link flex items-center px-4 py-3 rounded-xl transition-all font-label-bold text-label-bold" data-page="cotizador" href="#cotizador">
            <span class="material-symbols-outlined mr-4">calculate</span>Cotizador
        </a>
        <a class="nav-link flex items-center px-4 py-3 rounded-xl transition-all font-label-bold text-label-bold" data-page="clientes" href="#clientes">

        </a>
        <a class="nav-link flex items-center px-4 py-3 rounded-xl transition-all font-label-bold text-label-bold" data-page="inventario" href="#inventario">

        </a>
        <a class="nav-link flex items-center px-4 py-3 rounded-xl transition-all font-label-bold text-label-bold" data-page="proyectos" href="#proyectos">

        </a>

            <span class="material-symbols-outlined mr-4">settings</span>Configuración
        </a>
        <a class="nav-link flex items-center px-4 py-3 rounded-xl transition-all font-label-bold text-label-bold" data-page="usuarios" href="#usuarios">

<div id="sidebar-overlay" class="fixed inset-0 bg-black/50 z-40 hidden lg:hidden" onclick="toggleSidebar()"></div>

<div class="lg:pl-72 w-full">
    <!-- HEADER -->
    <header class="fixed top-0 left-0 lg:left-72 right-0 h-16 lg:h-20 bg-surface/80 backdrop-blur-xl z-30 flex items-center justify-between px-4 lg:px-margin-desktop">
        <div class="flex items-center gap-4">
            <button class="lg:hidden text-on-surface-variant" onclick="toggleSidebar()">
                <span class="material-symbols-outlined">menu</span>

        </div>
        <div class="flex items-center gap-3 lg:gap-6">
            <button class="bg-primary text-on-primary px-4 lg:px-6 py-2 rounded-lg font-label-bold text-label-bold hover:brightness-110 transition-all text-xs lg:text-label-bold" onclick="window.location.hash='#cotizador'">

        <!-- Modal content injected by JS -->
    </div>
</div>
